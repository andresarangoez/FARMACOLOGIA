<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>·</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --azul: #082956; --oro: #EDBE7B; --oro-2: #FBD785; --tx: #e8eef8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #061a3a; color: var(--tx); font-family: "Nunito Sans", system-ui, sans-serif; }
  #arriba { position: sticky; top: 0; z-index: 3; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: rgba(6,26,58,.96); border-bottom: 1px solid rgba(255,255,255,.1); }
  header b { font-family: Montserrat, sans-serif; font-size: 15px; color: var(--oro-2); white-space: nowrap; }
  #reloj { font: 800 14px Montserrat, sans-serif; color: #9fb0cc; margin-left: 10px; cursor: pointer; }
  select { font: 700 14px "Nunito Sans", sans-serif; color: #fff; background: #0c2b5c; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 6px 8px; max-width: 46vw; }
  .tamano { display: flex; gap: 6px; }
  .tamano button { width: 36px; height: 34px; font: 800 15px sans-serif; color: #fff; background: #0c2b5c; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; }
  nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 14px 12px; background: rgba(6,26,58,.97); border-bottom: 1px solid rgba(255,255,255,.1); }
  nav button { font: 800 18px "Nunito Sans", sans-serif; padding: 14px; border-radius: 16px; border: 0; cursor: pointer; }
  #ant { background: #0c2b5c; color: #fff; }
  #sig { background: var(--oro-2); color: var(--azul); }
  #estado { width: 9px; height: 9px; border-radius: 50%; background: #64748b; display: inline-block; margin-left: 6px; vertical-align: middle; }
  #estado.ok { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

  main { padding: 16px 18px 60px; max-width: 720px; margin: 0 auto; }
  .pant { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #0b1730; border: 1px solid rgba(255,255,255,.18); }
  .pant iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform-origin: 0 0; pointer-events: none; }
  #col-sig { display: none; }
  .rot { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #9fb0cc; margin: 12px 0 6px; }
  .n { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--oro); margin-top: 16px; }
  h1 { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.15; margin: 6px 0 18px; color: #fff; }
  .txt { font-size: 21px; line-height: 1.6; }
  .txt .def { color: var(--oro-2); font-style: italic; }
  .sig-tit { margin-top: 26px; padding-top: 16px; border-top: 1px dashed rgba(255,255,255,.2); font-size: 15px; color: #9fb0cc; }

  /* vista de presentador en pantallas anchas */
  @media (min-width: 980px) {
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #arriba { position: static; display: flex; align-items: stretch; }
    header { flex: 1; border-bottom: 1px solid rgba(255,255,255,.1); }
    nav { width: 360px; border-bottom: 1px solid rgba(255,255,255,.1); border-left: 1px solid rgba(255,255,255,.1); padding: 8px 12px; }
    nav button { padding: 10px; font-size: 16px; }
    main { flex: 1; min-height: 0; max-width: none; margin: 0; padding: 18px 22px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 26px; }
    #col-izq { min-height: 0; display: flex; flex-direction: column; }
    #col-sig { display: block; width: 46%; }
    #pant-act { width: min(100%, calc((100vh - 120px) * 1.778 * .62)); }
    #pant-sig { width: 100%; }
    #col-der { min-height: 0; overflow-y: auto; padding-right: 8px; }
    #col-der .n { margin-top: 0; }
    .txt { font-size: 22px; }
  }

  #llave { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #061a3a; }
  #llave.fuera { display: none; }
  #f { display: flex; align-items: center; gap: 10px; }
  #f span { font-size: 26px; color: var(--oro-2); }
  #pin { width: 150px; font: 800 26px sans-serif; letter-spacing: .4em; text-align: center; color: #fff; background: #0c2b5c; border: 1px solid rgba(255,255,255,.25); border-radius: 14px; padding: 10px; }
  #pin.mal { border-color: #ef4444; }
  #f button { font: 800 24px sans-serif; width: 52px; height: 52px; border-radius: 14px; border: 0; background: var(--oro-2); color: var(--azul); }
</style>
</head>
<body>
<div id="arriba">
  <header><b>✦<i id="estado"></i><span id="reloj" title="Reiniciar">00:00</span></b><select id="sel" aria-label="Ir a la diapositiva"></select><span class="tamano"><button type="button" id="menos" aria-label="−">−</button><button type="button" id="mas" aria-label="+">+</button></span></header>
  <nav><button type="button" id="ant">‹ Anterior</button><button type="button" id="sig">Siguiente ›</button></nav>
</div>
<main>
  <div id="col-izq">
    <div class="pant" id="pant-act"><iframe id="marco" title="·" tabindex="-1"></iframe></div>
    <div id="col-sig"><p class="rot">Sigue</p><div class="pant" id="pant-sig"><iframe id="marco-sig" title="·" tabindex="-1"></iframe></div></div>
  </div>
  <div id="col-der"><p class="n" id="n"></p><h1 id="t"></h1><div class="txt" id="txt"></div><p class="sig-tit" id="prox"></p></div>
</main>
<div id="llave"><form id="f"><span>✦</span><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="·"><button type="submit">›</button></form></div>
<script src="diapos.js"></script>
<script src="fichas.js"></script>
<script src="glosario.js"></script>
<script>
(function () {
  var llave = document.getElementById('llave'), pin = document.getElementById('pin');
  function abrir() { llave.classList.add('fuera'); try { sessionStorage.setItem('k', '1'); } catch (e) {} }
  try { if (sessionStorage.getItem('k') === '1') abrir(); } catch (e) {}
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); if (pin.value === '1234') abrir(); else { pin.classList.add('mal'); pin.value = ''; } });
  if (!llave.classList.contains('fuera')) pin.focus();

  var D = window.armarDiapos(), i = 0, fs = 21;
  try { fs = +localStorage.getItem('guion-fs') || 21; } catch (e) {}
  var sel = document.getElementById('sel');
  D.forEach(function (d, j) { var o = document.createElement('option'); o.value = j; o.textContent = (j + 1) + '. ' + d.titulo; sel.appendChild(o); });

  var ancho = matchMedia('(min-width: 980px)');
  var marco = document.getElementById('marco'), marcoSig = document.getElementById('marco-sig');
  var pantAct = document.getElementById('pant-act'), pantSig = document.getElementById('pant-sig');
  function escala() {
    marco.style.transform = 'scale(' + (pantAct.clientWidth / 1280) + ')';
    marcoSig.style.transform = 'scale(' + (pantSig.clientWidth / 1280) + ')';
  }
  addEventListener('resize', escala);
  function irMarco(m, k) {
    if (!m.dataset.ok) { m.src = 'index.html?mini=1#' + (k + 1); m.dataset.ok = 1; setTimeout(escala, 30); return; }
    try { m.contentWindow.location.hash = '#' + (k + 1); } catch (e) { m.src = 'index.html?mini=1#' + (k + 1); }
  }

  /* sincronización: mismo computador (BroadcastChannel) y celular (ntfy.sh); solo viaja el número de diapositiva */
  var SALA = (/[?&]s=([a-z0-9]+)/i.exec(location.search) || [])[1] || null;
  var canal = (SALA && window.BroadcastChannel) ? new BroadcastChannel('fa-' + SALA) : null;
  var estado = document.getElementById('estado');
  var ultT = {}, YO = Math.random().toString(36).slice(2, 9);
  function publicar(obj) {
    if (!SALA) return;
    obj.t = Date.now(); obj.o = YO;
    if (canal) try { canal.postMessage(obj); } catch (e) {}
    try { fetch('https://ntfy.sh/' + SALA, { method: 'POST', body: JSON.stringify(obj) }).catch(function () {}); } catch (e) {}
  }

  function ver(j, remoto) {
    i = Math.max(0, Math.min(D.length - 1, j));
    var d = D[i];
    irMarco(marco, i);
    if (ancho.matches && D[i + 1]) irMarco(marcoSig, i + 1);
    document.getElementById('col-sig').style.visibility = D[i + 1] ? 'visible' : 'hidden';
    if (!remoto) publicar({ de: 'cel', n: i });
    document.getElementById('n').textContent = 'Diapositiva ' + (i + 1) + ' de ' + D.length + (d.ses ? ' · Sesión ' + d.ses : '');
    document.getElementById('t').textContent = d.titulo;
    document.getElementById('txt').innerHTML = window.anotarSiglas(d.notas, function (def) { return ' <span class="def">(o sea, ' + def + ')</span>'; });
    document.getElementById('prox').textContent = D[i + 1] ? 'Sigue: ' + D[i + 1].titulo : 'Fin de la tutoría';
    document.getElementById('txt').style.fontSize = fs + 'px';
    sel.value = i; history.replaceState(null, '', location.search + '#' + (i + 1));
    var der = document.getElementById('col-der'); if (ancho.matches) der.scrollTop = 0; else scrollTo(0, 0);
  }
  document.getElementById('ant').onclick = function () { ver(i - 1); };
  document.getElementById('sig').onclick = function () { ver(i + 1); };
  sel.onchange = function () { ver(+sel.value); };
  function tam(dx) { fs = Math.max(15, Math.min(34, fs + dx)); try { localStorage.setItem('guion-fs', fs); } catch (e) {} document.getElementById('txt').style.fontSize = fs + 'px'; }
  document.getElementById('menos').onclick = function () { tam(-2); };
  document.getElementById('mas').onclick = function () { tam(2); };
  addEventListener('keydown', function (e) {
    if (e.target === pin || e.target === sel) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); ver(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); ver(i - 1); }
  });

  /* cronómetro */
  var t0 = Date.now(), reloj = document.getElementById('reloj');
  reloj.onclick = function () { t0 = Date.now(); };
  setInterval(function () { var s = Math.floor((Date.now() - t0) / 1000); reloj.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2); }, 1000);

  ver((parseInt(location.hash.slice(1), 10) || 1) - 1, true);
  escala();
  ancho.addEventListener ? ancho.addEventListener('change', function () { ver(i, true); escala(); }) : null;

  function recibir(m) { if (!m || (m.de !== 'pc' && m.de !== 'cel') || typeof m.n !== 'number' || m.o === YO) return; var o = m.o || '?'; if (m.t && m.t <= (ultT[o] || 0)) return; ultT[o] = m.t || 0; if (m.n !== i) ver(m.n, true); }
  if (canal) { canal.onmessage = function (ev) { estado.classList.add('ok'); recibir(ev.data); }; canal.postMessage({ de: 'cel-hola' }); }
  if (SALA && window.EventSource) {
    var fuente = new EventSource('https://ntfy.sh/' + SALA + '/sse');
    fuente.onopen = function () { estado.classList.add('ok'); publicar({ de: 'cel-hola' }); };
    fuente.onerror = function () { if (!canal) estado.classList.remove('ok'); };
    fuente.onmessage = function (ev) { try { recibir(JSON.parse(JSON.parse(ev.data).message || '{}')); } catch (e) {} };
  }
})();
</script>
</body>
</html>
