<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Soy Andrés Arango · Cambiar color</title>
<meta name="robots" content="noindex, nofollow">
<style>
    :root { --azul: #092755; --linea: #D5E0EF; --tx: #1F2A3A; --suave: #5B6778; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: var(--tx); background: #F6F8FB; line-height: 1.5; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; color: var(--azul); margin: 0 0 4px; }
    p.lead { margin: 0 0 20px; color: var(--suave); }
    .rejilla { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 20px; align-items: start; }
    @media (max-width: 760px) { .rejilla { grid-template-columns: 1fr; } }
    .panel { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 18px; }
    .vista { aspect-ratio: 1 / 1; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--linea); overflow: hidden; }
    .vista svg { width: 70%; height: 70%; display: block; }
    .cuadros { background-color: #fff; background-image: linear-gradient(45deg, #e6e9ef 25%, transparent 25%, transparent 75%, #e6e9ef 75%), linear-gradient(45deg, #e6e9ef 25%, transparent 25%, transparent 75%, #e6e9ef 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
    h2 { font-size: 1rem; margin: 0 0 12px; color: var(--azul); }
    .canal { display: grid; grid-template-columns: 22px 1fr 64px; gap: 10px; align-items: center; margin-bottom: 10px; }
    .canal b { font-weight: 800; }
    .canal input[type=number] { width: 100%; padding: 6px 8px; border: 1.5px solid var(--linea); border-radius: 8px; font: inherit; }
    input[type=range] { width: 100%; height: 8px; border-radius: 99px; appearance: none; -webkit-appearance: none; outline-offset: 4px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--azul); cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--azul); cursor: pointer; }
    #r { background: linear-gradient(90deg, #000, #f00); }
    #g { background: linear-gradient(90deg, #000, #0f0); }
    #b { background: linear-gradient(90deg, #000, #00f); }
    .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    label.campo { font-size: .85rem; font-weight: 600; color: var(--suave); display: block; margin-bottom: 4px; }
    input[type=text] { width: 100%; padding: 8px 10px; border: 1.5px solid var(--linea); border-radius: 8px; font: inherit; font-family: ui-monospace, Consolas, monospace; }
    input[type=color] { width: 44px; height: 38px; border: 1.5px solid var(--linea); border-radius: 8px; padding: 2px; background: #fff; cursor: pointer; }
    select { padding: 8px 10px; border: 1.5px solid var(--linea); border-radius: 8px; font: inherit; background: #fff; }
    button { font: inherit; font-weight: 700; font-size: .9rem; padding: 10px 14px; border-radius: 999px; border: 2px solid var(--azul); background: var(--azul); color: #fff; cursor: pointer; }
    button.sec { background: #fff; color: var(--azul); }
    button:hover { filter: brightness(1.15); }
    .muestras { display: flex; gap: 8px; flex-wrap: wrap; }
    .muestras button { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 2px solid #9aa7ba; }
    .nota { font-size: .8rem; color: var(--suave); margin-top: 14px; }
    #msg { font-size: .85rem; color: #2F6B45; min-height: 1.2em; font-weight: 600; }
    :focus-visible { outline: 3px solid #0A3E7C; outline-offset: 2px; }
</style>
</head>
<body>
<main>
    <h1>Logo Soy Andrés Arango</h1>
    <p class="lead">Cambia el color en RGB y descarga el logo en SVG (vector) o PNG transparente.</p>

    <div class="rejilla">
        <div class="panel">
            <div class="vista cuadros" id="vista">
                <!-- Vectorización fiel del logo. Todo usa currentColor: hereda el color del contenedor. -->
                <svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Soy Andrés Arango"><title>Soy Andrés Arango</title><path fill="currentColor" fill-rule="evenodd" d="M108.57 26.25L11.75 193.95L25.37 193.95L108.57 49.85L180.33 174.15L193.96 174.15ZM131.63 26.6L124.82 38.4L207.81 182.15L64.29 182.15L57.47 193.95L228.25 193.95ZM108.57 65.85L23.18 213.75L216.82 213.75L210.01 201.95L43.62 201.95L115.38 77.65ZM111.47 123.45L95.18 163.3L103.17 166.61L109.67 150.64L126.35 150.64L126.35 166.54L134.97 166.54L134.97 123.45L126.35 123.45L126.35 142.13L113.18 142.13L117.23 132.19L124.45 132.19L124.45 123.45Z"/></svg>
            </div>
            <div class="fila">
                <label class="campo" for="fondo" style="margin:0">Fondo de la vista</label>
                <select id="fondo">
                    <option value="cuadros">Transparente (cuadros)</option>
                    <option value="#FFFFFF">Blanco</option>
                    <option value="#000000">Negro</option>
                    <option value="#092755">Azul profundo</option>
                    <option value="#FBD785">Amarillo</option>
                </select>
            </div>
        </div>

        <div class="panel">
            <h2>Color del logo</h2>
            <div class="canal"><b style="color:#c00">R</b><input type="range" id="r" min="0" max="255" value="255" aria-label="Rojo"><input type="number" id="rn" min="0" max="255" value="255" aria-label="Rojo (número)"></div>
            <div class="canal"><b style="color:#080">G</b><input type="range" id="g" min="0" max="255" value="255" aria-label="Verde"><input type="number" id="gn" min="0" max="255" value="255" aria-label="Verde (número)"></div>
            <div class="canal"><b style="color:#00c">B</b><input type="range" id="b" min="0" max="255" value="255" aria-label="Azul"><input type="number" id="bn" min="0" max="255" value="255" aria-label="Azul (número)"></div>

            <div class="fila" style="align-items:end">
                <div style="flex:1"><label class="campo" for="hex">Hexadecimal</label><input type="text" id="hex" value="#FFFFFF" maxlength="7" spellcheck="false"></div>
                <div><label class="campo" for="sel">Selector</label><input type="color" id="sel" value="#ffffff"></div>
            </div>
            <label class="campo">Colores rápidos</label>
            <div class="muestras">
                <button type="button" class="sec" data-c="0,0,0" style="background:#000" aria-label="Negro" title="Negro"></button>
                <button type="button" class="sec" data-c="255,255,255" style="background:#fff" aria-label="Blanco" title="Blanco"></button>
                <button type="button" class="sec" data-c="9,39,85" style="background:#092755" aria-label="Azul profundo" title="Azul profundo #092755"></button>
                <button type="button" class="sec" data-c="10,62,124" style="background:#0A3E7C" aria-label="Azul" title="Azul #0A3E7C"></button>
                <button type="button" class="sec" data-c="251,215,133" style="background:#FBD785" aria-label="Amarillo" title="Amarillo #FBD785"></button>
            </div>
            <div class="fila" style="margin-top:16px">
                <label class="campo" for="tam" style="margin:0">Tamaño PNG</label>
                <select id="tam"><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select>
            </div>
            <div class="fila">
                <button type="button" id="dsvg">Descargar SVG</button>
                <button type="button" id="dpng" class="sec">Descargar PNG</button>
                <button type="button" id="copiar" class="sec">Copiar SVG</button>
            </div>
            <div id="msg" role="status" aria-live="polite"></div>
            <p class="nota">El SVG descargado lleva el color fijo que elegiste. Para usarlo con <code>currentColor</code> (que tome el color del texto de tu página) usa <code>logo-soy-andres-arango.svg</code>.</p>
        </div>
    </div>
</main>

<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var logo = $('logo'), vista = $('vista'), msg = $('msg');
    var c = { r: 255, g: 255, b: 255 };

    function hex(v) { return ('0' + v.toString(16)).slice(-2); }
    function aHex() { return ('#' + hex(c.r) + hex(c.g) + hex(c.b)).toUpperCase(); }
    function limitar(n) { n = parseInt(n, 10); return isNaN(n) ? 0 : Math.max(0, Math.min(255, n)); }

    function pintar() {
        logo.style.color = 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
        ['r', 'g', 'b'].forEach(function (k) { $(k).value = c[k]; $(k + 'n').value = c[k]; });
        $('hex').value = aHex(); $('sel').value = aHex().toLowerCase();
    }
    function fijar(r, g, b) { c.r = limitar(r); c.g = limitar(g); c.b = limitar(b); pintar(); }

    ['r', 'g', 'b'].forEach(function (k) {
        $(k).addEventListener('input', function () { c[k] = limitar(this.value); pintar(); });
        $(k + 'n').addEventListener('input', function () { c[k] = limitar(this.value); pintar(); });
    });
    $('hex').addEventListener('input', function () {
        var m = /^#?([0-9a-f]{6})$/i.exec(this.value.trim());
        if (m) fijar(parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16));
    });
    $('sel').addEventListener('input', function () {
        var v = this.value; fijar(parseInt(v.slice(1, 3), 16), parseInt(v.slice(3, 5), 16), parseInt(v.slice(5, 7), 16));
    });
    document.querySelectorAll('.muestras button').forEach(function (b) {
        b.addEventListener('click', function () { var p = b.dataset.c.split(','); fijar(p[0], p[1], p[2]); });
    });
    $('fondo').addEventListener('change', function () {
        if (this.value === 'cuadros') { vista.className = 'vista cuadros'; vista.style.background = ''; }
        else { vista.className = 'vista'; vista.style.background = this.value; }
    });

    function svgTexto() {
        var s = new XMLSerializer().serializeToString(logo).replace(/ style="[^"]*"/, '');
        return '<?xml version="1.0" encoding="UTF-8"?>\n' + s.replace(/currentColor/g, aHex());
    }
    function descargar(blob, nombre) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }
    function aviso(t) { msg.textContent = t; setTimeout(function () { msg.textContent = ''; }, 2500); }

    $('dsvg').addEventListener('click', function () {
        descargar(new Blob([svgTexto()], { type: 'image/svg+xml' }), 'logo-soy-andres-arango-' + aHex().slice(1).toLowerCase() + '.svg');
        aviso('SVG descargado');
    });
    $('dpng').addEventListener('click', function () {
        var n = parseInt($('tam').value, 10), img = new Image();
        img.onload = function () {
            var cv = document.createElement('canvas'); cv.width = n; cv.height = n;
            cv.getContext('2d').drawImage(img, 0, 0, n, n);
            cv.toBlob(function (b) { descargar(b, 'logo-soy-andres-arango-' + aHex().slice(1).toLowerCase() + '-' + n + '.png'); aviso('PNG descargado'); }, 'image/png');
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgTexto().replace(/^<\?xml[^>]*>\s*/, '').replace('<svg ', '<svg width="' + n + '" height="' + n + '" '));
    });
    $('copiar').addEventListener('click', function () {
        var t = svgTexto();
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { aviso('SVG copiado'); }, function () { aviso('No se pudo copiar'); });
        else aviso('Tu navegador no permite copiar aquí');
    });

    pintar();
    /* arranca en blanco; el fondo de la vista parte oscuro para que se vea */
    $('fondo').value = '#092755'; $('fondo').dispatchEvent(new Event('change'));
})();
</script>
</body>
</html>
